apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailcatcher.fullname" . }}-mail
  labels:
    {{- include "mailcatcher.labels" . | nindent 4 }}
  {{- if or .Values.mail.hostname .Values.mail.service.annotations }}
  annotations:
    {{- if .Values.mail.hostname }}
    external-dns.kubernetes.io/hostname: {{ .Values.mail.hostname | quote }}
    {{- end }}
    {{- with .Values.mail.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.mail.service.type }}
  {{- with .Values.mail.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with .Values.mail.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - name: smtp
      port: {{ .Values.smtp.servicePort }}
      targetPort: smtp
      protocol: TCP
    {{- if .Values.smtp.tls.enabled }}
    - name: smtps
      port: {{ .Values.smtp.tls.servicePort }}
      targetPort: smtps
      protocol: TCP
    {{- end }}
    {{- if .Values.imap.enabled }}
    - name: imap
      port: {{ .Values.imap.servicePort }}
      targetPort: imap
      protocol: TCP
    - name: imaps
      port: {{ .Values.imap.tlsServicePort }}
      targetPort: imaps
      protocol: TCP
    {{- end }}
  selector:
    {{- include "mailcatcher.selectorLabels" . | nindent 4 }}
