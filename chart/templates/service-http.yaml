apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailcatcher.fullname" . }}-http
  labels:
    {{- include "mailcatcher.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.http.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mailcatcher.selectorLabels" . | nindent 4 }}
